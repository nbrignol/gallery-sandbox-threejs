<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Galerie</title>
    <style>
      /* Preloader : modale centrée sur un voile (en ligne pour s'afficher avant le chargement du JS) */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        color: #fff;
        font-family: system-ui, sans-serif;
        transition: opacity 0.4s ease;
      }
      #preloader.is-done {
        opacity: 0;
        pointer-events: none;
      }
      .preloader-modal {
        box-sizing: border-box;
        width: min(24rem, calc(100vw - 2rem));
        padding: 1.5rem;
        background: #000;
        border-radius: 0.5rem;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      }
      .preloader-title {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: 0.08em;
      }
      #loading-steps {
        margin: 1rem 0 0;
        padding: 0;
        list-style: none;
        font-size: 0.95rem;
        line-height: 1.7;
      }
      #loading-steps li::before {
        display: inline-block;
        width: 1.5em;
      }
      #loading-steps .is-pending {
        opacity: 0.4;
      }
      #loading-steps .is-pending::before { content: '○'; }
      #loading-steps .is-active::before { content: '…'; }
      #loading-steps .is-done::before { content: '✓'; }
      #loading-steps .is-done {
        opacity: 0.7;
      }
      /* Les points ont une largeur fixe : le texte ne bouge pas pendant l'animation */
      #preloader .dots {
        display: inline-block;
        width: 1.5em;
        text-align: left;
      }
      #preloader .dots::after {
        content: '';
        animation: preloader-dots 1.2s steps(1, end) infinite;
      }
      @keyframes preloader-dots {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <div class="preloader-modal" role="dialog" aria-live="polite" aria-label="Chargement">
        <p class="preloader-title">Chargement en cours<span class="dots"></span></p>
        <ul id="loading-steps"></ul>
      </div>
    </div>
    <canvas id="scene"></canvas>
    <header>
      <span id="site-name"></span><span id="galleries-nav"></span>
    </header>
    <div id="fps">-- FPS</div>
    <div id="debug-hud" hidden></div>
    <div id="quality">
      <label><input type="checkbox" id="opt-minimal" /> Minimal</label>
      <label><input type="checkbox" id="opt-low" /> Low</label>
      <label><input type="checkbox" id="opt-debug" /> Debug</label>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
